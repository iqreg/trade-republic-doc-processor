version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tgg
      POSTGRES_PASSWORD: tgg
      POSTGRES_DB: tgg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn tgg.apps.api.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: python -m tgg.apps.worker.pipeline

volumes:
  pgdata:
